components:
  schemas:
    File:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - content_type
        - size
        - instance_id
        - owner_id
        - visibility
        - state
        - last_error
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          description: UTF-8 最多 255 字节，不含路径分隔符或控制字符。
        content_type:
          type: string
        size:
          type: integer
          minimum: 0
        instance_id:
          type: string
        owner_id:
          type: string
        visibility:
          type: string
          enum:
            - private
            - public
        state:
          type: string
          enum:
            - pending
            - ready
            - deleting
        last_error:
          type: string
          description: 安全错误代码；空字符串表示没有记录错误。
        created_at: &a1
          type: string
          format: date-time
        updated_at: *a1
    Instance:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - provider
        - private_supported
        - secret_ref
        - enabled
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        provider: &a2
          type: string
          enum:
            - s3
            - telegram
            - github
        private_supported:
          type: boolean
        secret_ref: &a3
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
        enabled:
          type: boolean
        created_at: *a1
    APIKey:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - prefix
        - scopes
        - status
        - expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes: &a4
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum:
              - upload
              - read
              - delete
        status: &a6
          type: string
          enum:
            - enabled
            - disabled
            - revoked
        expires_at:
          anyOf: &a5
            - *a1
            - type: "null"
        created_at: *a1
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            file_id:
              type: string
    FilePage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: ./common.schemas.yaml#/components/schemas/File
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
          maximum: 100000
    InstanceList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: ./common.schemas.yaml#/components/schemas/Instance
    KeyList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: ./common.schemas.yaml#/components/schemas/APIKey
    KeySecret:
      type: object
      additionalProperties: false
      required:
        - api_key
        - secret
      properties:
        api_key:
          $ref: ./common.schemas.yaml#/components/schemas/APIKey
        secret:
          type: string
          pattern: ^fv_[A-Za-z0-9_-]{43}$
          description: 仅本次响应展示。不可记录日志或在前端持久保存。
    LoginInput:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 1
          maxLength: 72
          format: password
    LoginResult:
      type: object
      additionalProperties: false
      required:
        - access_token
        - token_type
        - expires_at
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_at: *a1
    CreateInstance:
      type: object
      additionalProperties: false
      required:
        - name
        - provider
        - private_supported
        - secret_ref
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        provider: *a2
        private_supported:
          type: boolean
          description: 实例是否具备真实私有访问能力。mock 仅模拟此策略，真实接入时必须核验上游权限。
        secret_ref: *a3
    UpdateInstance:
      type: object
      additionalProperties: false
      required: []
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        enabled:
          type: boolean
      minProperties: 1
    CreateKey:
      type: object
      additionalProperties: false
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        scopes: *a4
        expires_at:
          anyOf: *a5
          default: null
          description: 默认永不过期；指定时必须晚于当前时间。
    UpdateKey:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status: *a6
    System:
      type: object
      additionalProperties: false
      required:
        - mode
        - backend
        - version
        - max_file_bytes
        - max_total_bytes
        - database
        - real_providers
      properties:
        mode:
          type: string
          const: mock
        backend:
          type: string
          enum:
            - go
            - worker-ts
        version:
          type: string
        max_file_bytes:
          type: integer
          const: 8388608
        max_total_bytes:
          type: integer
          const: 33554432
        database:
          type: string
          const: memory
        real_providers:
          type: boolean
          const: false
