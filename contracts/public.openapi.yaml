openapi: 3.1.0
info:
  title: FluxVault Public API
  version: 0.1.0
  description: V1 首阶段本地 mock 契约。真实 D1 和 Provider 接入另行验收；错误消息可本地化，客户端根据 error.code
    判断。生产环境只部署一种后端。
  license:
    name: UNLICENSED
servers:
  - url: http://127.0.0.1:18080
    description: Go 本地 mock
  - url: http://127.0.0.1:8787
    description: Worker 本地 mock；Public/Admin 通过独立路径隔离
security:
  - ApiKey: []
paths:
  /api/v1/files:
    get:
      operationId: publicListFiles
      summary: 分页列出文件
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: ./common.schemas.yaml#/components/schemas/FilePage
        default:
          $ref: "#/components/responses/Error"
      description: 需要 read scope。只列出此 API Key 拥有的文件，不允许匿名列举。
      parameters:
        - name: q
          in: query
          required: false
          description: 文件名包含搜索，最多 50 UTF-8 字节。
          schema:
            type: string
            maxLength: 50
        - name: state
          in: query
          required: false
          description: state
          schema:
            type: string
            enum:
              - pending
              - ready
              - deleting
        - name: visibility
          in: query
          required: false
          description: visibility
          schema:
            type: string
            enum: &a1
              - private
              - public
        - name: instance_id
          in: query
          required: false
          description: instance_id
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          description: offset
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
    post:
      operationId: publicUploadFile
      summary: 代理上传文件
      responses:
        "201":
          description: 内容与元数据均已就绪
          content:
            application/json:
              schema:
                $ref: ./common.schemas.yaml#/components/schemas/File
        default:
          $ref: "#/components/responses/Error"
      description: 请求体为文件原始字节，Content-Type 表示媒体类型。先建立 pending，上传成功后 ready。失败返回
        error.file_id 供管理员排查。此阶段 mock 单文件最多 8 MiB，总量 32 MiB；不表示生产全局限制。private
        为默认值；不支持私有的实例拒绝 private。Public 入口需要 upload scope。
      parameters:
        - name: name
          in: query
          required: true
          description: 文件名
          schema:
            type: string
            minLength: 1
            description: UTF-8 最多 255 字节，不含路径分隔符或控制字符。
        - name: instance_id
          in: query
          required: true
          description: 目标存储实例
          schema:
            type: string
        - name: visibility
          in: query
          required: false
          description: visibility
          schema:
            type: string
            enum: *a1
            default: private
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
  /api/v1/files/{id}:
    get:
      operationId: publicGetFile
      summary: 读取文件记录
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: ./common.schemas.yaml#/components/schemas/File
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - &a2
          name: id
          in: path
          required: true
          description: 稳定资源 ID。
          schema:
            type: string
      description: 需要 read scope 且文件属于当前 Key；其他 Key 的记录统一返回 404。
    delete:
      operationId: publicDeleteFile
      summary: 删除文件或重试删除
      responses:
        "204":
          description: 删除完成，无响应体
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - *a2
      description: Public 需要 delete scope 且拥有该文件。pending 不允许删除，须人工排查。先进入
        deleting，Telegram 只移除元数据，其他实例先删除远端再清理元数据。失败保留 deleting 与定位信息，可重复 DELETE
        重试。
  /api/v1/files/{id}/content:
    get:
      operationId: publicDownloadFile
      summary: 下载文件内容
      responses:
        "200":
          description: 流式文件内容，Content-Disposition 为 attachment。
          content:
            "*/*":
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: 浏览器以附件处理，文件名经过编码。
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
        default:
          $ref: "#/components/responses/Error"
      parameters:
        - *a2
        - name: mode
          in: query
          required: false
          description: mode
          schema:
            type: string
            enum:
              - auto
              - proxy
              - direct
            default: auto
      description: 只有 ready 可下载。public 可匿名下载；private 需要所属 Key 的 read scope 或 Admin
        入口的管理员 JWT。无权访问 private 返回 404。有 Authorization 时无效令牌仍返回 401。mock 的 auto
        使用 proxy，direct 明确返回 422；不签发虚假预签名 URL。响应不缓存，不支持 Range 或断点续传。
      security:
        - {}
        - ApiKey: []
components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: 创建或轮换时获取的高熵 API Key；不具备 Admin 权限。
  responses:
    Error:
      description: 请求失败。error.code 是稳定机器代码，error.message 是可本地化说明。上传或删除失败时可包含 file_id
        供排查。状态码包括 400、401、403、404、409、413、422、429、500、502、503，具体语义见操作说明。
      content:
        application/json:
          schema:
            $ref: ./common.schemas.yaml#/components/schemas/Error
