# 替换域名与证书路径；两个入口均支持 HTTP 和 HTTPS，向 Go 回源始终使用 HTTP
server {
    listen 80;
    listen 443 ssl;
    server_name files.example.com;
    ssl_certificate /etc/nginx/certs/files.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/files.key;
    client_max_body_size 8m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 130s;
    }

    location / { return 404; }
}

server {
    listen 80;
    listen 443 ssl;
    server_name admin.example.com;
    ssl_certificate /etc/nginx/certs/admin.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/admin.key;
    client_max_body_size 8m;

    location /admin/v1/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 130s;
    }

    location / { return 404; }
}
